name: Build LineageOS 14.1 (SM-T116)

on:
  workflow_dispatch:
    inputs:
      stock_kernel:
        description: 'Use the stock 4.4 kernel + dt.img (matches the stock mali.ko)'
        type: boolean
        default: false

jobs:
  build:
    name: Build ROM for goyave3g
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Maximize Build Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo rm -rf /usr/share/swift /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/powershell /usr/local/share/chromium
          sudo docker image prune --all --force || true
          sudo apt-get clean || true
          df -h

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python2 bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev git-lfs liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop patch pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev openjdk-8-jdk
          sudo apt-get clean
          sudo ln -sf /usr/bin/python2 /usr/bin/python
          sudo update-java-alternatives -s java-1.8.0-openjdk-amd64 || true
          sudo sed -i 's/TLSv1, TLSv1.1, //g' /usr/lib/jvm/java-8-openjdk-amd64/jre/lib/security/java.security

      - name: Install Repo Tool
        run: |
          mkdir -p ~/bin
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo

      - name: Initialize & Sync LineageOS 14.1 Source
        run: |
          export PATH=~/bin:$PATH
          git config --global user.name "shipper10"
          git config --global user.email "shipper10@users.noreply.github.com"
          git config --global color.ui false
          mkdir -p ~/android/lineage
          cd ~/android/lineage
          repo init -u https://github.com/LineageOS/android.git -b cm-14.1 --depth=1
          mkdir -p .repo/local_manifests
          cat << 'EOF' > .repo/local_manifests/goyave3g.xml
          <?xml version="1.0" encoding="UTF-8"?>
          <manifest>
            <project name="shipper10/android_device_samsung_goyave3g" path="device/samsung/goyave3g" remote="github" revision="cm-14.1-ril-fix" />
            <project name="shipper10/proprietary_vendor_samsung_goyave3g" path="vendor/samsung/goyave3g" remote="github" revision="cm-14.1-ril-fix" />
            <project name="LineageOS/android_hardware_samsung" path="hardware/samsung" remote="github" revision="cm-14.1" />
          </manifest>
          EOF
          repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

          # Sync required dependency from lineage.dependencies.mk safely
          if [ ! -d external/stlport ]; then
            git clone --depth=1 -b cm-14.1 https://github.com/LineageOS/android_external_stlport.git external/stlport
          fi

          # webview.apk lives in git-lfs inside the separate project
          # external/chromium-webview/prebuilt/<arch>. repo sync leaves ~130-byte
          # text pointers there and SignApk then dies with ZipException, so
          # fetch the real file (only arm is needed for this 32-bit device).
          cd ~/android/lineage/external/chromium-webview/prebuilt/arm
          git lfs install --local
          git lfs pull
          ls -l webview.apk
          unzip -tq webview.apk >/dev/null || { echo "::error::webview.apk still not a valid zip"; head -c 200 webview.apk; exit 1; }
          cd ~/android/lineage

      - name: Restore CCACHE
        uses: actions/cache/restore@v4
        with:
          path: ~/.ccache
          key: ccache-goyave3g-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ccache-goyave3g-

      - name: Pre-flight checks (device tree sanity)
        run: |
          cd ~/android/lineage
          D=device/samsung/goyave3g
          fail=0
          for f in kernel dt.img configs/audio/audio_policy.conf configs/gps/gps.xml \
                   libs/libmemoryheapion_sprd/Android.mk libs/libion_sprd/Android.mk \
                   libs/compat/sprd_compat.h patches/cm-14.1/external_tinyalsa.diff \
                   patches/cm-14.1/frameworks_av.diff; do
            [ -e "$D/$f" ] || { echo "MISSING: $D/$f"; fail=1; }
          done
          # Every PRODUCT_COPY_FILES source that lives in the device tree must exist
          grep -ohE '\$\(LOCAL_PATH\)/[A-Za-z0-9_./-]+' $D/device.mk $D/device_goyave3g.mk | sort -u | while read -r p; do
            q="$D/${p#\$(LOCAL_PATH)/}"
            [ -e "$q" ] || echo "WARNING: referenced but missing: $q"
          done
          # GCC-only flag must not be active (breaks clang with -mapcs)
          if grep -E '^[[:space:]]*HWUI_COMPILE_FOR_PERF' $D/BoardConfig.mk; then echo "HWUI_COMPILE_FOR_PERF still active"; fail=1; fi
          grep -q '^TARGET_NEEDS_PLATFORM_TEXT_RELOCATIONS := true' $D/BoardConfig.mk || { echo "TEXT_RELOCATIONS missing"; fail=1; }
          if grep -rn execmod $D/sepolicy/; then echo "execmod rules present in sepolicy"; fail=1; fi
          exit $fail

      - name: Apply AOSP Patches (idempotent, strict)
        run: |
          set -e
          cd ~/android/lineage
          PATCH_DIR="$PWD/device/samsung/goyave3g/patches/cm-14.1"

          apply_patch() {
            local repo_dir="$1" patch_file="$PATCH_DIR/$2"
            echo "=== $2 -> $repo_dir ==="
            [ -f "$patch_file" ] || { echo "ERROR: $patch_file not found"; exit 1; }
            cd "$repo_dir"
            if git apply -R --check "$patch_file" 2>/dev/null; then
              echo "already applied, skipping"
            elif git apply --check "$patch_file"; then
              git apply "$patch_file"
              echo "applied cleanly"
            else
              echo "ERROR: $2 neither applies nor is already applied on $repo_dir"
              git log -1 --oneline
              exit 1
            fi
            cd - >/dev/null
          }

          # Only what cannot live inside the device tree:
          apply_patch external/tinyalsa "external_tinyalsa.diff"   # pcm_set_samplerate()
          apply_patch frameworks/av     "frameworks_av.diff"       # ACodec: SPRD decoder pixel formats

      - name: Build ROM (goyave3g)
        env:
          GOYAVE3G_USE_STOCK_KERNEL: ${{ inputs.stock_kernel && 'true' || 'false' }}
        run: |
          export JAVA_HOME=/usr/lib/jvm/java-8-openjdk-amd64
          export PATH=$JAVA_HOME/bin:~/bin:$PATH
          export LC_ALL=C
          export USE_CCACHE=1
          export CCACHE_DIR=~/.ccache
          export CCACHE_COMPRESS=1
          mkdir -p ~/.ccache
          ccache -M 5G

          export _JAVA_OPTIONS="-Xmx4g"
          export ANDROID_JACK_VM_ARGS="-Dfile.encoding=UTF-8 -XX:+TieredCompilation -Xmx4g"
          export JACK_SERVER_VM_ARGUMENTS="-Dfile.encoding=UTF-8 -XX:+TieredCompilation -Xmx4g"

          cd ~/android/lineage
          JACK_JAR=$(ls ./prebuilts/sdk/tools/jack-server-*.jar | head -n 1)
          ./prebuilts/sdk/tools/jack-admin install-server ./prebuilts/sdk/tools/jack-launcher.jar "$JACK_JAR" || true
          ./prebuilts/sdk/tools/jack-admin start-server || true

          TOTAL_RAM_GB=$(free -g | awk '/^Mem:/{print $2}')
          if [ "$TOTAL_RAM_GB" -ge 12 ]; then JOBS=$(nproc); else JOBS=2; fi
          echo "Detected RAM: ${TOTAL_RAM_GB}GB -> Building with -j${JOBS}"

          source build/envsetup.sh
          lunch lineage_goyave3g-userdebug
          set -o pipefail
          mka -j"$JOBS" framework-res org.cyanogenmod.platform-res 2>&1 | tee ~/build_prebuild.log
          mka -j"$JOBS" bacon 2>&1 | tee ~/build_bacon.log
          ccache -s

      - name: Diagnostics on failure (disk, webview.apk)
        if: failure()
        run: |
          df -h || true
          cd ~/android/lineage 2>/dev/null || exit 0
          du -sh out 2>/dev/null || true
          ls -l external/chromium-webview/prebuilt/arm/webview.apk || true
          d=out/target/product/goyave3g/obj/APPS/webview_intermediates
          ls -l $d || true
          for f in $d/package.apk*; do echo "== $f"; unzip -tq "$f" 2>&1 | tail -2; done || true

      - name: Save CCACHE
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ~/.ccache
          key: ccache-goyave3g-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload Build Logs
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            ~/build_prebuild.log
            ~/build_bacon.log
            ~/android/lineage/out/error.log
          if-no-files-found: ignore

      - name: Upload Built ROM
        uses: actions/upload-artifact@v4
        with:
          name: LineageOS-14.1-goyave3g
          path: |
            ~/android/lineage/out/target/product/goyave3g/lineage-14.1-*.zip
            ~/android/lineage/out/target/product/goyave3g/lineage-14.1-*.zip.md5sum
          if-no-files-found: error
